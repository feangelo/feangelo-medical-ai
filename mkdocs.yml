site_name: Felipe Angelo Medical AI Lab
site_description: A scientific learning portfolio in medical imaging, quantitative analysis, and Medical AI.
site_author: Felipe Angelo
site_url: https://feangelo.github.io/feangelo-medical-ai/
repo_url: https://github.com/feangelo/feangelo-medical-ai
repo_name: feangelo/feangelo-medical-ai
theme:
  name: material
  language: en
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy

nav:
  - Home: index.md
  - Work: work.md
  - Learning: learning.md
  - Research Notes: research-notes.md
  - About: about.md
  - Documentation:
      - Vision: vision.md
      - Roadmap: roadmap.md
      - Architecture: architecture.md
      - Data Governance: data-governance.md
      - Case Standard: case-standard.md
      - Development: development.md
      - Wiki: wiki/index.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/felipe-angelo-1812a985
      name: Felipe Angelo on LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/feangelo
      name: Felipe Angelo on GitHub

copyright: Felipe Angelo · FAMAI Lab · Scientific learning portfolio

strict: true
